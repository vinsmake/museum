# Construye el museo y lo publica en GitHub Pages en cada push a main.
# Documentación: memories/despliegue.md
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Caché de imágenes optimizadas (después de npm ci, que borra node_modules): sin ella tarda ~5 minutos
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-imagenes-${{ hashFiles('src/content/mitologias/*/imagenes/**') }}
          restore-keys: astro-imagenes-
      - run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
