nombre: Mitología griega
estado: activa
orden: 1
descripcion: >-
  El nacimiento del mundo y de los dioses tal como lo canta Hesíodo en la Teogonía:
  desde el Caos primordial hasta el reinado de Zeus y su descendencia.
canon:
  obra: Teogonía
  autor: Hesíodo
  fecha: c. 700 a. C.
  traduccionReferencia: H. G. Evelyn-White (1914), dominio público. Las citas en español son traducción propia.
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0130
criterioOrden: >-
  El orden de cada ser es el número del verso de la Teogonía en que se narra su nacimiento u origen;
  si el poema no lo narra, el verso de su primera mención. Las Musas, cantadas en el proemio (vv. 1-115),
  abren el recorrido. Los decimales desempatan seres del mismo verso (117, 117.1...) en el orden en que se nombran.
tema:
  piedra: '#e9e4da'
  acento: '#b08d57'

categorias:
  - id: primordial
    nombre: Primordiales
    descripcion: Las primeras potencias del cosmos, surgidas sin padres o del Caos.
  - id: titan
    nombre: Titanes
    descripcion: Los doce hijos de Gea y Urano y su generación.
  - id: olimpico
    nombre: Olímpicos y Crónidas
    descripcion: Los hijos de Crono y Rea y los grandes dioses que reinan desde el Olimpo tras la Titanomaquia.
  - id: deidad
    nombre: Deidades
    descripcion: Dioses y diosas que no son titanes ni olímpicos.
  - id: personificacion
    nombre: Personificaciones
    descripcion: Conceptos convertidos en divinidad (la Muerte, el Sueño, la Discordia...).
  - id: ninfa
    nombre: Ninfas
    descripcion: Nereidas, Oceánides, Melias y otras divinidades femeninas de la naturaleza.
  - id: raza
    nombre: Razas primigenias
    descripcion: Cíclopes, Hecatónquiros y Gigantes.
  - id: monstruo
    nombre: Monstruos
    descripcion: Criaturas como Tifón, Equidna, la Hidra o la Quimera.
  - id: criatura
    nombre: Criaturas
    descripcion: Seres fabulosos que no son monstruos, como Pegaso, Crisaor o el centauro Quirón.
  - id: mortal
    nombre: Mortales y héroes
    descripcion: Pandora, los héroes y los mortales que se unen a los dioses.

# Salas en el orden del poema. Cada ser cae en la sala cuyo rango contiene su `orden`.
salas:
  - id: proemio
    nombre: Las Musas del Helicón
    versos: 1-115
    descripcion: Hesíodo pastorea sus ovejas al pie del Helicón cuando las nueve Musas, hijas de Zeus y Mnemósine, le enseñan el canto y le piden que celebre el linaje de los dioses.
  - id: primordiales
    nombre: El origen del mundo
    versos: 116-125
    descripcion: Primero fue el Caos. Después surgen Gea, el Tártaro y Eros; del Caos nacen Érebo y la Noche, y de la Noche, el Éter y el Día.
  - id: hijos-de-gea
    nombre: Hijos de Gea y Urano
    versos: 126-153
    descripcion: Gea da a luz al Cielo estrellado, a las Montañas y al Mar. Unida a Urano engendra a los doce Titanes, a los Cíclopes y a los Hecatónquiros.
  - id: castracion
    nombre: La caída de Urano
    versos: 154-210
    descripcion: Urano esconde a sus hijos en el seno de la Tierra. Crono lo castra con la hoz de Gea; de la sangre nacen las Erinias, los Gigantes y las Melias, y de la espuma, Afrodita.
  - id: hijos-de-nix
    nombre: Hijos de la Noche y la Discordia
    versos: 211-232
    descripcion: La Noche engendra sola a la Muerte, el Sueño, los Sueños, las Moiras y las Keres. Su hija Eris, la Discordia, pare las penas que afligen a los mortales.
  - id: linaje-del-mar
    nombre: El linaje del mar
    versos: 233-336
    descripcion: Ponto y Gea engendran a Nereo y a los dioses del mar. De ellos vienen las cincuenta Nereidas, Iris y las Harpías, las Grayas, las Gorgonas y una estirpe de monstruos.
  - id: hijos-de-titanes
    nombre: Hijos de los Titanes
    versos: 337-452
    descripcion: Los Titanes se unen y nacen los ríos y las Oceánides, el Sol, la Luna y la Aurora, los Vientos y las estrellas, Estigia y sus hijos, y Hécate, honrada por Zeus.
  - id: olimpicos
    nombre: El nacimiento de los Olímpicos
    versos: 453-506
    descripcion: Rea da a luz a Hestia, Deméter, Hera, Hades, Poseidón y Zeus. Crono los devora uno a uno, hasta que Rea le da a tragar una piedra en lugar del menor.
  - id: prometeo
    nombre: Prometeo y Pandora
    versos: 507-616
    descripcion: Prometeo engaña a Zeus en el reparto del sacrificio y roba el fuego. En castigo, los dioses fabrican a la primera mujer y Prometeo queda encadenado.
  - id: titanomaquia
    nombre: Titanomaquia y Tifón
    versos: 617-880
    descripcion: Diez años de guerra entre Titanes y Olímpicos. Con los Hecatónquiros y el rayo de los Cíclopes, Zeus vence y encierra a los Titanes en el Tártaro; luego derrota a Tifón.
  - id: reinado-de-zeus
    nombre: El reinado de Zeus
    versos: 881-1022
    descripcion: Zeus reparte los honores y se une a Metis, Temis, Hera y otras diosas. Nacen los dioses del Olimpo y los héroes hijos de diosas y mortales.
